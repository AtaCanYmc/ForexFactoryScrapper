name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install dev & security tools (black, flake8, bandit)
        run: |
          python -m pip install black flake8 bandit

      - name: Security scan (bandit)
        run: |
          bandit -r src/

      - name: Lint (black)
        run: |
          black --check . || true

      - name: Lint (flake8)
        run: |
          flake8 || true

      - name: Run tests
        run: |
          pytest -q

      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os, sys
          broken = []
          for f in glob.glob("**/*.md", recursive=True):
              content = re.sub(r"```[\s\S]*?```", "", open(f, encoding="utf-8").read())
              content = re.sub(r"`[^`]*`", "", content)
              for link in re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content):
                  link = link.strip().split("?")[0]
                  if not link or link.startswith("#"): continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link}")
          if broken:
              print("Broken internal links detected:", broken, file=sys.stderr)
              sys.exit(1)
          print("Internal documentation links verified.")
          '

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/forexfactory-scrapper

      - name: Render chart (defaults)
        run: helm template ci deploy/helm/forexfactory-scrapper > /dev/null

      - name: Render chart (ingress and TLS)
        run: |
          helm template ci deploy/helm/forexfactory-scrapper \
            --set ingress.enabled=true \
            --set ingress.tls.enabled=true > /dev/null
