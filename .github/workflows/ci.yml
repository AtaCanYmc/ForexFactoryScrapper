name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install dev & security tools (black, flake8, bandit)
        run: |
          python -m pip install black flake8 bandit

      - name: Security scan (bandit)
        run: |
          bandit -r src/

      - name: Lint (black)
        run: |
          black --check .

      - name: Lint (flake8)
        run: |
          flake8

      - name: Run tests
        run: |
          pytest -q

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint deploy/helm/forexfactory-scrapper

      - name: Render chart (defaults)
        run: helm template ci deploy/helm/forexfactory-scrapper > /dev/null

      - name: Render chart (ingress and TLS)
        run: |
          helm template ci deploy/helm/forexfactory-scrapper \
            --set ingress.enabled=true \
            --set ingress.tls.enabled=true > /dev/null

  api-contract:
    name: API Contract (Bruno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Start API
        run: |
          python main.py &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/api/health && exit 0
            sleep 1
          done
          echo "API did not start" >&2
          exit 1

      - name: Run offline Bruno requests
        working-directory: bruno
        run: |
          bru run Hello.bru Health.bru Metrics.bru "OpenAPI Spec.bru" \
            "Error - Invalid Date.bru" "Error - Missing Params.bru" \
            "Error - Limit Too Large.bru" "Error - Unknown Bundle Source.bru" \
            --env local
