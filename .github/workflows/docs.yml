name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify static site assets
        run: |
          test -f pages/index.html
          test -f pages/index.css
          test -f pages/index.js
          test -f pages/robots.txt
          test -f pages/sitemap.xml
          test -f pages/llms.txt
          test -f pages/assets/banner.jpg
          test -f pages/assets/architecture.svg

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          force_orphan: true
