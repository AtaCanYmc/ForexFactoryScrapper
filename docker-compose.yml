# Usage: DOMAIN=api.example.com docker compose up -d
# DOMAIN defaults to localhost (Caddy issues a locally trusted internal certificate).
# For a public domain, ports 80 and 443 must reach this host so Caddy can obtain a Let's Encrypt certificate.
services:
  app:
    build: .
    image: forexfactory-scrapper
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      LOG_FORMAT: json
      TRUST_PROXY_HOPS: "1"
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
